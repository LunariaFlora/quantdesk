<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观澜 QuantDesk · 操作演示</title>
<style>
:root{color-scheme:dark;--bg:#0c121c;--panel:#131e2d;--card:#192638;--border:#2c3c52;--text:#e6edf6;--muted:#a3b5cc;--blue:#82aaff;--green:#54dbb4;--red:#ff8d9b;--gold:#efbf64}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}button,select{font:inherit}button,select,a.download{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;padding:9px 14px}button{cursor:pointer}button:hover,a.download:hover{background:#273951}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#365fc1;border-color:#587fde}.primary:hover{background:#426fd3}.muted{color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.skip{position:absolute;top:-80px;z-index:9}.skip:focus{top:5px}header{display:flex;align-items:center;justify-content:space-between;padding:20px 30px;border-bottom:1px solid var(--border);gap:16px}.brand{font-size:23px;letter-spacing:1px}.brand small{font-size:12px;display:block;color:var(--muted);letter-spacing:2px}.head-actions{display:flex;align-items:center;gap:12px}.badge{font-size:12px;border:1px solid var(--border);padding:4px 10px;border-radius:20px;color:var(--muted)}.shell{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:calc(100vh - 95px)}aside{padding:24px 16px;border-right:1px solid var(--border)}nav{display:grid;gap:9px}nav button{text-align:left;border-color:transparent;background:transparent;padding:14px}nav button.active{background:#294365;border-color:#446080}nav span{display:inline-block;width:25px;color:var(--muted);font-size:12px}.aside-note{font-size:12px;color:var(--muted);margin:32px 12px}main{padding:25px 30px;min-width:0;max-width:1700px;width:100%;margin:auto}h1{font-size:27px;margin:0 0 3px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}p{margin:8px 0 16px}.page-title{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:block;margin-bottom:16px}.field>span{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field select{width:100%}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}.facts div{border-bottom:1px solid var(--border);padding-bottom:10px}.facts small{display:block;color:var(--muted);font-size:12px}.wide{width:100%}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.cards.six{grid-template-columns:repeat(6,1fr)}.metric{padding:16px;background:var(--card);border:1px solid var(--border);border-radius:10px}.metric small{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:24px;font-variant-numeric:tabular-nums}.chart svg{width:100%;display:block;min-height:180px}.chart{min-width:0}.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.legend{font-size:12px;display:flex;gap:15px;flex-wrap:wrap}.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:5px}.chart-readout{min-height:24px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.chart rect.candle:hover{stroke:#fff;stroke-width:2}.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tabs button.active{background:#2d4667}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:11px 12px;border-bottom:1px solid var(--border)}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:500}tbody tr:hover{background:#203149}tbody tr.selected{background:#294365}.trade-row{cursor:pointer}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.step{padding:20px;background:var(--card);border:1px solid var(--border);border-radius:12px;text-align:left}.step b{display:block;font-size:17px;margin:8px 0}.number{font-size:12px;color:var(--blue);letter-spacing:2px}.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}.notice{padding:12px 16px;background:#1c2d44;border-left:3px solid var(--blue);border-radius:6px;font-size:13px}.tour{position:sticky;top:10px;z-index:5;background:#233b5a;border:1px solid #6688b9;border-radius:12px;padding:16px 20px;margin-bottom:20px;box-shadow:0 8px 35px #0008;display:grid;grid-template-columns:1fr auto;gap:12px}.tour b{display:block}.tour p{font-size:13px;margin:5px 0}.tour-controls{display:flex;align-items:center;gap:8px}.hidden,[hidden]{display:none!important}.status{color:var(--muted);font-size:12px;padding:7px 0;min-height:29px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:280px;overflow:auto;background:var(--bg);padding:14px;border-radius:8px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:14px;width:min(1200px,95vw);max-height:94vh;padding:20px}dialog::backdrop{background:#000b}dialog img{width:100%;display:block;margin:14px 0;border-radius:6px}.native-top{display:flex;justify-content:space-between;align-items:center}.source-links{overflow-wrap:anywhere;font-size:12px}a{color:var(--blue)}.empty{padding:30px;text-align:center;border:1px dashed var(--border);border-radius:10px;margin-top:16px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.log{padding:12px;border-bottom:1px solid var(--border);font-size:13px}.log small{color:var(--muted);margin-right:12px}.compare-row{cursor:pointer}.compare-row.active{background:#294365}details{margin:10px 0}summary{cursor:pointer;color:var(--blue)}@media(max-width:1200px){.cards.six{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:245px minmax(0,1fr)}main{padding:22px}.shell{grid-template-columns:170px minmax(0,1fr)}.metric strong{font-size:22px}}@media(max-width:820px){header{padding:16px;flex-wrap:wrap}.head-actions{flex-wrap:wrap}.badge{display:none}.shell{display:block}aside{border-right:0;border-bottom:1px solid var(--border);padding:10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:9px 12px}.aside-note{display:none}main{padding:16px}.grid,.two{grid-template-columns:1fr}.cards,.cards.six{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr}.page-title{align-items:start}.tour{grid-template-columns:1fr;position:static}.tour-controls{flex-wrap:wrap}.foot{flex-wrap:wrap}.brand{font-size:20px}.panel{padding:15px}h1{font-size:24px}.chart svg{min-height:150px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<a class="skip" href="#main">跳到主要内容</a>
<header><div class="brand">观澜 <span class="muted">QUANT DESK</span><small>历史日线 · 策略研究 · 操作演示</small></div><div class="head-actions"><span class="badge">离线 HTML · 真实历史样本</span><button id="native">查看原生软件</button><button class="primary" id="start-tour">开始导览</button></div></header>
<div class="shell"><aside><nav aria-label="功能导航"><button data-page="overview" class="active"><span>01</span>使用流程</button><button data-page="data"><span>02</span>行情数据</button><button data-page="strategy"><span>03</span>策略管理</button><button data-page="research"><span>04</span>回测研究</button><button data-page="compare"><span>05</span>实验与比较</button><button data-page="logs"><span>06</span>任务日志</button></nav><div class="aside-note">单标的 · 仅做多<br>信号收盘确定<br>下一日开盘执行<br><br>无实盘下单</div></aside>
<main id="main"><div id="tour" class="tour" hidden><div><span class="number" id="tour-number"></span><b id="tour-title"></b><p id="tour-copy"></p></div><div class="tour-controls"><button id="tour-prev">上一步</button><button class="primary" id="tour-next">下一步</button><button id="tour-close">结束导览</button></div></div><div id="content"></div><div id="status" class="status" role="status" aria-live="polite">已就绪 · 无需联网，选择一个步骤开始</div></main></div>
<dialog id="native-dialog"><div class="native-top"><h2>Windows 原生软件 · 实际运行截图</h2><button id="close-native">关闭</button></div><p class="muted">交付 EXE 的验收截图。HTML 演示沿用操作流程，布局针对浏览器调整。</p><img src="__NATIVE_SCREENSHOT__" alt="实际 Windows 软件显示 AAPL 双均线回测、成交、资产曲线和回撤"><p class="muted">使用桌面软件：完整解压交付包 → 保留 _internal → 双击 QuantDesk.exe。它会以普通窗口启动；不需要安装 Python。</p></dialog>
<script id="demo-data" type="application/json">__DEMO_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('demo-data').textContent), $=id=>document.getElementById(id);
const state={page:'overview',dataset:'sample',strategy:'sma30',result:null,tab:'chart',tradePage:0,tour:-1,logs:[],runToken:0};
const names={sma30:'双均线 SMA 10 / 30',sma60:'双均线 SMA 10 / 60',rsi:'RSI 超卖 / 超买'};
const fmt=(n,d=2)=>n==null?'—':Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ds=()=>DATA.datasets.find(d=>d.id===state.dataset), result=()=>ds().results[state.strategy];
const option=(value,label,current)=>`<option value="${esc(value)}" ${value===current?'selected':''}>${esc(label)}</option>`;
const dataSelect=()=>`<label class="field"><span>数据集 · 8 组真实历史数据</span><select id="dataset">${DATA.datasets.map(d=>option(d.id,d.name,state.dataset)).join('')}</select></label>`;
const strategySelect=()=>`<label class="field"><span>策略示例</span><select id="strategy">${Object.entries(names).map(([k,v])=>option(k,v,state.strategy)).join('')}</select></label>`;
const heading=(title,sub)=>`<div class="page-title"><div><h1>${title}</h1><div class="muted">${sub}</div></div><span class="badge">${esc(ds().symbol)} · 日线</span></div>`;
const metric=(label,value,color='')=>`<div class="metric"><small>${label}</small><strong class="${color}">${value}</strong></div>`;
const sign=n=>n>=0?'positive':'negative';
function status(text){$('status').textContent=text}
function log(text){state.logs.unshift({time:new Date().toLocaleTimeString('zh-CN'),text});status(text)}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);log('已导出 '+name)}
function csv(rows){if(!rows.length)return '\ufeffno_records\n';const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];const cell=v=>'"'+String(v==null?'':typeof v==='object'?JSON.stringify(v):v).replaceAll('"','""')+'"';return '\ufeff'+keys.join(',')+'\r\n'+rows.map(r=>keys.map(k=>cell(r[k])).join(',')).join('\r\n')}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function go(page){state.page=page;render();document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function changed(){state.runToken++;state.result=null;state.tradePage=0;log('选择已更新 · 点击运行示例展示对应结果');render()}
function bindSelects(){if($('dataset'))$('dataset').onchange=e=>{state.dataset=e.target.value;changed()};if($('strategy'))$('strategy').onchange=e=>{state.strategy=e.target.value;changed()}}
function overview(){return `${heading('从行情到研究结果','按六个步骤体验一次完整的量化研究')}<div class="notice">这是离线交互演示：使用包内真实历史行情，展示项目引擎预先计算的 24 份结果。无需启动 EXE；不联网获取新行情，不执行任意参数回测。</div><div class="steps" style="margin-top:20px">${[['data','01','准备行情','选择数据集，查看 K 线、成交量和来源。'],['strategy','02','配置策略','理解均线或 RSI 的入场、离场规则。'],['research','03','运行示例','查看收益、回撤、账户资产及基准。'],['research','04','核对成交','查看买卖日期、价格和数量，定位图表。'],['compare','05','比较实验','在相同数据、区间和费用下比较三种策略。'],['research','06','导出报告','保存真实报告 JSON、成交与资产 CSV。']].map(([p,n,t,c])=>`<button class="step" data-go="${p}"><span class="number">STEP ${n}</span><b>${t}</b><span class="muted">${c}</span></button>`).join('')}</div><div class="two" style="margin-top:20px"><div class="panel"><h2>先懂这三个概念</h2><p><b>行情</b>是历史市场价格；<b>策略</b>是决定持仓的规则；<b>回测</b>是在历史数据上模拟执行规则。</p><p class="muted">收盘信号下一日开盘执行。账户资产 = 现金 + 持仓市值。盈利结果包含未平仓持仓的浮盈浮亏。</p></div><div class="panel"><h2>打开真正的桌面程序</h2><p>完整解压 Windows 包，保留 <code>_internal</code>，双击 <code>QuantDesk.exe</code>。</p><p class="muted">本机数据保存于 %LOCALAPPDATA%/QuantDesk。仅点击“获取行情”时下载历史数据，保存后可离线回测。</p></div></div>`}
function market(){const d=ds(),rows=d.rows,last=rows.at(-1),prev=rows.at(-2);return `${heading('行情数据','先检查数据范围和价格口径，再开始研究')}<div class="grid"><section class="panel">${dataSelect()}<h3>数据概览</h3><div class="facts"><div><small>日线数量</small>${fmt(rows.length,0)}</div><div><small>周期</small>每日 OHLCV</div><div><small>开始日期</small>${rows[0].date}</div><div><small>结束日期</small>${last.date}</div></div><p class="muted" style="font-size:13px;margin-top:16px">${d.id==='000001.SS'?'上证指数用于历史研究，不能作为股票直接买卖。':'所有报价均为历史数据，不是当前实时价格。'}</p><button class="wide" id="export-data">导出行情 CSV</button><button class="primary wide" style="margin-top:10px" data-go="strategy">下一步：选择策略</button></section><div><div class="cards">${metric('历史收盘',fmt(last.close))}${metric('最后交易日涨跌',fmt((last.close/prev.close-1)*100)+'%',sign(last.close-prev.close))}${metric('最后交易日成交量',fmt(last.volume,0))}${metric('数据条数',fmt(rows.length,0))}</div><div class="panel chart"><div class="chart-title"><h2>行情与成交量</h2><span class="muted">最近 126 个交易日</span></div><div id="price-chart"></div><div class="chart-readout" id="ohlc">悬停 K 线查看 OHLCV；键盘 Tab 也可逐根查看</div></div><details class="panel"><summary>来源与清洗记录</summary><p class="muted">Yahoo 使用返回的原始 OHLC，不读取 adjusted close。没有额外复权或分红现金处理；不补造缺失交易日。</p><pre>${esc(JSON.stringify(d.metadata,null,2))}</pre></details></div></div>`}
function strategyPage(){return `${heading('策略管理','先理解规则，再观察它在不同市场中的表现')}<div class="grid"><section class="panel">${dataSelect()}${strategySelect()}<button class="primary wide" data-go="research">下一步：运行示例</button></section><section class="panel"><h2>${names[state.strategy]}</h2>${state.strategy==='rsi'?'<p>RSI 衡量近期价格上涨与下跌的相对强度。本示例采用周期 14：空仓时 RSI 低于 30，目标为持仓；持仓时 RSI 达到 65，目标为空仓。</p>':'<p>SMA 是最近若干个收盘价的平均值。快线采用 10 日，慢线采用 '+(state.strategy==='sma30'?30:60)+' 日：快线高于慢线时，目标为持仓；不高于时，目标为空仓。预热结束时满足条件即可入场，不必等新的交叉。</p>'}<div class="notice">信号在收盘后确定，最早下一交易日开盘执行。手续费和滑点会影响实际价格与数量。</div><h3 style="margin-top:20px">本次示例使用的统一设置</h3><div class="facts"><div><small>初始资金</small>100,000</div><div><small>目标仓位</small>80%</div><div><small>手续费（每笔）</small>5 bps = 0.05%</div><div><small>不利滑点</small>5 bps = 0.05%</div><div><small>交易单位</small>1 股 / 单位</div><div><small>共同开始日期</small>${result().summary.start}</div></div><p class="muted" style="margin-top:16px">HTML 提供三个固定策略示例。桌面软件另支持 EMA、布林带、MACD、通道突破、买入持有、自定义规则和可编辑参数。</p></section></div>`}
function research(){const r=state.result,s=r?.summary;return `${heading('回测研究','收盘信号 · 下一日开盘执行 · 单标的历史模拟')}<div class="grid"><section class="panel">${dataSelect()}${strategySelect()}<div class="facts"><div><small>本金</small>100,000</div><div><small>仓位</small>80%</div><div><small>手续费</small>5 bps</div><div><small>滑点</small>5 bps</div><div><small>开始</small>${result().summary.start}</div><div><small>结束</small>${result().summary.end}</div></div><p class="muted" style="font-size:12px;margin-top:15px">示例结果已经由原项目引擎计算。点击后载入对应结果；不启动桌面程序。</p><button id="run" class="primary wide">运行示例</button><button id="export-report" class="wide" style="margin-top:10px" ${r?'':'disabled'}>导出完整报告 JSON</button></section><div>${r?`<div class="cards six">${metric('累计收益',fmt(s.return_pct)+'%',sign(s.return_pct))}${metric('年化收益',fmt(s.annualized_return_pct)+'%',sign(s.annualized_return_pct))}${metric('最大回撤',fmt(s.max_drawdown_pct)+'%','negative')}${metric('夏普',fmt(s.sharpe))}${metric('胜率',fmt(s.win_rate_pct)+'%')}${metric('总盈亏',fmt(s.pnl),sign(s.pnl))}</div><div class="panel"><h2>${names[state.strategy]} · ${ds().symbol}</h2><div class="muted">资产 ${fmt(s.equity)} · 现金 ${fmt(s.cash)} · 持仓 ${fmt(s.shares,0)} · ${s.trades} 笔成交</div><div class="tabs" role="group" aria-label="回测结果视图">${[['chart','图表'],['trades','成交'],['account','账户账本'],['export','导出与口径']].map(([k,v])=>`<button data-tab="${k}" class="${state.tab===k?'active':''}">${v}</button>`).join('')}</div><div id="result-body"></div></div>`:`<div class="panel chart"><h2>回测前 · 真实历史行情</h2><div id="price-chart"></div><div class="chart-readout" id="ohlc"></div><div class="empty"><h3>尚未运行本次示例</h3><span class="muted">行情不是策略收益。点击左侧“运行示例”，展示资产曲线、回撤及成交。</span></div></div>`}</div></div>`}
function compare(){return `${heading('实验与比较','相同数据 · 相同交易区间 · 相同本金和交易成本')}<div class="panel"><div style="max-width:400px">${dataSelect()}</div><div class="legend">${Object.entries(names).map(([k,v],i)=>`<span><i style="background:${['#82aaff','#efbf64','#54dbb4'][i]}"></i>${v}</span>`).join('')}</div><div class="chart" id="compare-chart"></div><div class="chart-readout" id="compare-readout"></div>${table(['策略','累计收益 %','最大回撤 %','夏普','成交笔数','操作'],Object.entries(ds().results).map(([k,r])=>`<tr class="compare-row ${k===state.strategy?'active':''}"><td>${names[k]}</td><td class="${sign(r.summary.return_pct)}">${fmt(r.summary.return_pct)}</td><td class="negative">${fmt(r.summary.max_drawdown_pct)}</td><td>${fmt(r.summary.sharpe)}</td><td>${r.summary.trades}</td><td><button data-load="${k}">载入结果</button></td></tr>`))}<p class="muted" style="font-size:13px;margin-top:15px">共同区间：${result().summary.start} — ${result().summary.end}。比较从第 61 根日线开始，保留统一预热。历史样本中的最优结果不证明未来最优；本演示不执行自动选股或未来预测。</p></div>`}
function logs(){return `${heading('任务日志','本次 HTML 演示中的选择、结果展示和文件导出')}<div class="panel"><h2>操作记录 <span class="muted">${state.logs.length}</span></h2>${state.logs.length?state.logs.map(l=>`<div class="log"><small>${esc(l.time)}</small>${esc(l.text)}</div>`).join(''):'<p class="muted">还没有操作记录。先选择数据并运行一个示例。</p>'}<p class="muted" style="margin-top:18px">这些记录只保留在当前页面内存，刷新后清空。不会访问桌面程序的个人数据库。</p></div>`}
function render(){const views={overview,data:market,strategy:strategyPage,research,compare,logs};$('content').innerHTML=views[state.page]();bindSelects();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));if(state.page==='data'||state.page==='research'&&!state.result)priceChart(ds().rows,'price-chart');if($('export-data'))$('export-data').onclick=()=>download(ds().symbol+'-history.csv',csv(ds().rows),'text/csv;charset=utf-8');if($('run'))$('run').onclick=runExample;if($('export-report'))$('export-report').onclick=()=>download(ds().symbol+'-'+state.strategy+'-report.json',JSON.stringify(state.result,null,2));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});if(state.page==='research'&&state.result)renderResult();if(state.page==='compare'){lineChart('compare-chart',Object.entries(ds().results).map(([k,r],i)=>({label:names[k],rows:r.curve,key:'equity',color:['#82aaff','#efbf64','#54dbb4'][i]})),'compare-readout');document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{state.strategy=b.dataset.load;state.result=result();state.tab='chart';log('载入 '+names[state.strategy]+' 的真实结果');go('research')})}}
function runExample(){const token=++state.runToken,button=$('run');button.disabled=true;status('正在展示 '+ds().symbol+' · '+names[state.strategy]+' 的预计算结果…');requestAnimationFrame(()=>{setTimeout(()=>{if(token!==state.runToken)return;state.result=result();state.tab='chart';state.tradePage=0;log('示例已展示：'+ds().symbol+' · '+names[state.strategy]+' · '+state.result.summary.trades+' 笔成交');render()},200)})}
function renderResult(){const r=state.result;if(state.tab==='chart'){$('result-body').innerHTML='<div class="chart"><div class="chart-title"><h3>行情与成交 · 最近 126 日</h3><span class="muted">▲ 买入　▼ 卖出</span></div><div id="price-chart"></div><div id="ohlc" class="chart-readout"></div></div><div class="two"><div class="chart"><h3>账户资产 / 买入持有基准</h3><div class="legend"><span><i style="background:#82aaff"></i>策略资产</span><span><i style="background:#a3b5cc"></i>买入持有（虚线）</span></div><div id="equity-chart"></div><div id="equity-readout" class="chart-readout"></div></div><div class="chart"><h3>回撤 %</h3><div id="dd-chart"></div><div id="dd-readout" class="chart-readout"></div></div></div>';priceChart(r.curve,'price-chart',r.trades);lineChart('equity-chart',[{rows:r.curve,key:'equity',color:'#82aaff',label:'策略资产'},{rows:r.curve,key:'benchmark',color:'#a3b5cc',label:'买入持有',dash:true}],'equity-readout');lineChart('dd-chart',[{rows:r.curve,key:'drawdown',color:'#ff8d9b',label:'回撤 %'}],'dd-readout')}
else if(state.tab==='trades'){const start=state.tradePage*12,part=r.trades.slice(start,start+12);$('result-body').innerHTML=table(['日期','方向','成交价','数量','手续费','原因'],part.map((t,i)=>`<tr class="trade-row" data-date="${t.date}"><td><button data-focus="${t.date}" aria-label="查看 ${t.date} 的成交行情">${t.date}</button></td><td class="${t.side==='BUY'?'positive':'negative'}">${t.side==='BUY'?'买入':'卖出'}</td><td>${fmt(t.price,4)}</td><td>${fmt(t.quantity,0)}</td><td>${fmt(t.fee)}</td><td>${esc(t.reason)}</td></tr>`))+'<div class="foot"><span class="muted">'+r.trades.length+' 笔成交 · 点击日期定位行情</span><div class="toolbar"><button id="trade-prev" '+(start===0?'disabled':'')+'>上一页</button><span>'+ (state.tradePage+1)+' / '+Math.max(1,Math.ceil(r.trades.length/12))+'</span><button id="trade-next" '+(start+12>=r.trades.length?'disabled':'')+'>下一页</button><button id="export-trades">导出成交 CSV</button></div></div><div id="focused-trade" class="chart" style="margin-top:16px"></div><div id="ohlc" class="chart-readout"></div>';$('trade-prev').onclick=()=>{state.tradePage--;renderResult()};$('trade-next').onclick=()=>{state.tradePage++;renderResult()};$('export-trades').onclick=()=>download(ds().symbol+'-trades.csv',csv(r.trades),'text/csv;charset=utf-8');document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const idx=r.curve.findIndex(row=>row.date===b.dataset.focus);priceChart(r.curve.slice(Math.max(0,idx-20),idx+21),'focused-trade',r.trades,b.dataset.focus);status('已定位成交日期 '+b.dataset.focus)})}
else if(state.tab==='account'){$('result-body').innerHTML='<div class="notice">资产 = 现金 + 持仓市值；总盈亏 = 已实现 + 未实现。期末持仓按收盘估值，不强制清仓。</div>'+table(['日期','现金','持仓','持仓市值','资产','已实现盈亏','未实现盈亏'],r.curve.slice(-12).map(b=>`<tr><td>${b.date}</td><td>${fmt(b.cash)}</td><td>${fmt(b.shares,0)}</td><td>${fmt(b.market_value)}</td><td>${fmt(b.equity)}</td><td>${fmt(b.realized_pnl)}</td><td>${fmt(b.unrealized_pnl)}</td></tr>`))+'<p class="muted">这里展示最后 12 个交易日；导出包含完整逐日账本。</p><button id="export-equity">导出完整资产 CSV</button>';$('export-equity').onclick=()=>download(ds().symbol+'-equity.csv',csv(r.curve),'text/csv;charset=utf-8')}
else{$('result-body').innerHTML='<h3>导出本次真实示例</h3><p class="muted">JSON 包含配置、来源、绩效、曲线、订单、成交和已平仓交易。CSV 可用 Excel 查看。</p><div class="toolbar">'+[['summary','绩效'],['trades','成交'],['orders','订单'],['round_trips','已平仓交易'],['equity','资产账本']].map(([k,v])=>`<button data-export="${k}">${v} CSV</button>`).join('')+'</div><details><summary>计算假设与限制</summary><pre>'+esc(JSON.stringify(r.assumptions,null,2))+'</pre></details><p class="muted">日线止损无法还原日内路径；本版不模拟完整 A 股交易制度、企业行动现金调整或多资产组合，无实盘下单。</p>';document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>download(ds().symbol+'-'+b.dataset.export+'.csv',csv(b.dataset.export==='summary'?[r.summary]:b.dataset.export==='equity'?r.curve:r[b.dataset.export]),'text/csv;charset=utf-8'))}}
function axes(width,height,min,max,format=fmt){const left=66,right=15,top=16,bottom=28,w=width-left-right,h=height-top-bottom;let html='';for(let i=0;i<4;i++){const value=min+(max-min)*i/3,y=top+h-i*h/3;html+=`<line x1="${left}" x2="${width-right}" y1="${y}" y2="${y}" stroke="#2c3c52"/><text x="${left-8}" y="${y+4}" fill="#a3b5cc" text-anchor="end" font-size="11">${format(value)}</text>`}return {left,top,w,h,html,y:v=>top+h-(v-min)/(max-min||1)*h}}
function priceChart(all,target,trades=[],focus=''){const rows=all.slice(-126),width=Math.max(320,$(target).clientWidth),height=310;let min=Math.min(...rows.map(r=>r.low)),max=Math.max(...rows.map(r=>r.high)),pad=(max-min)*.08||1;const a=axes(width,height,min-pad,max+pad,v=>fmt(v,1)),dx=a.w/rows.length,x=i=>a.left+(i+.5)*dx;let html=a.html;const volumeMax=Math.max(...rows.map(r=>r.volume))||1;rows.forEach((r,i)=>{const color=r.close>=r.open?'#54dbb4':'#ff8d9b',yy=Math.min(a.y(r.open),a.y(r.close)),hh=Math.max(1.5,Math.abs(a.y(r.open)-a.y(r.close)));html+=`<g data-bar="${i}"><line x1="${x(i)}" x2="${x(i)}" y1="${a.y(r.high)}" y2="${a.y(r.low)}" stroke="${color}"/><rect class="candle" tabindex="0" aria-label="${r.date} 收盘 ${fmt(r.close)}" x="${x(i)-Math.max(1,dx*.3)}" y="${yy}" width="${Math.max(2,dx*.6)}" height="${hh}" fill="${color}"/><rect x="${x(i)-dx*.3}" y="${height+48-r.volume/volumeMax*38}" width="${Math.max(2,dx*.6)}" height="${r.volume/volumeMax*38}" fill="${color}" opacity=".45"/></g>`;if(r.date===focus)html+=`<line x1="${x(i)}" x2="${x(i)}" y1="16" y2="${height+48}" stroke="#efbf64" stroke-dasharray="3 3"/>`});trades.forEach(t=>{const i=rows.findIndex(r=>r.date===t.date);if(i>=0){const yy=a.y(t.price),buy=t.side==='BUY';html+=`<path d="M ${x(i)} ${yy+(buy?-9:9)} l -5 ${buy?9:-9} h 10 Z" fill="${buy?'#82aaff':'#efbf64'}" stroke="#0c121c"/>`}});html+=`<text x="${a.left}" y="${height-5}" fill="#a3b5cc" font-size="11">${rows[0].date}</text><text x="${width-15}" y="${height-5}" fill="#a3b5cc" text-anchor="end" font-size="11">${rows.at(-1).date}</text><text x="${a.left}" y="${height+20}" fill="#a3b5cc" font-size="11">成交量</text>`;$(target).innerHTML=`<svg viewBox="0 0 ${width} ${height+55}" role="img" aria-label="历史 OHLC K 线与成交量">${html}</svg>`;$(target).querySelectorAll('[data-bar]').forEach(g=>{const show=()=>{const r=rows[+g.dataset.bar];if($('ohlc'))$('ohlc').textContent=`${r.date}　开 ${fmt(r.open)}　高 ${fmt(r.high)}　低 ${fmt(r.low)}　收 ${fmt(r.close)}　量 ${fmt(r.volume,0)}`};g.onmouseenter=show;g.querySelector('rect').onfocus=show})}
function lineChart(target,series,readout){const width=Math.max(320,$(target).clientWidth),height=270,all=series.flatMap(s=>s.rows.map(r=>r[s.key])).filter(Number.isFinite);let min=Math.min(...all),max=Math.max(...all),pad=(max-min)*.08||1;const a=axes(width,height,min-pad,max+pad,v=>Math.abs(v)>1000?fmt(v,0):fmt(v,1));let html=a.html;series.forEach(s=>{const points=s.rows.map((r,i)=>`${a.left+i/(s.rows.length-1)*a.w},${a.y(r[s.key])}`).join(' ');html+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} points="${points}"/>`});const rows=series[0].rows;html+=`<text x="${a.left}" y="${height-5}" fill="#a3b5cc" font-size="11">${rows[0].date}</text><text x="${width-15}" y="${height-5}" fill="#a3b5cc" text-anchor="end" font-size="11">${rows.at(-1).date}</text><line class="crosshair" y1="16" y2="${height-28}" stroke="#a3b5cc" stroke-dasharray="3 3" opacity="0"/>`;$(target).innerHTML=`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${series.map(s=>s.label).join('、')} 历史曲线">${html}</svg>`;const svg=$(target).querySelector('svg');svg.onmousemove=e=>{const bounds=svg.getBoundingClientRect(),xx=(e.clientX-bounds.left)/bounds.width*width,idx=Math.min(rows.length-1,Math.max(0,Math.round((xx-a.left)/a.w*(rows.length-1)))),line=svg.querySelector('.crosshair');line.setAttribute('x1',a.left+idx/(rows.length-1)*a.w);line.setAttribute('x2',a.left+idx/(rows.length-1)*a.w);line.setAttribute('opacity',1);$(readout).textContent=rows[idx].date+'　'+series.map(s=>s.label+' '+fmt(s.rows[idx][s.key])).join('　')};svg.onmouseleave=()=>svg.querySelector('.crosshair').setAttribute('opacity',0)}
const tourSteps=[['data','准备行情','选择数据集，观察实际日期、K 线与成交量，展开来源记录。桌面版还能下载和导入新的 CSV。'],['strategy','理解策略','选择双均线或 RSI。留意规则、仓位、费用，以及信号在下一日开盘执行的假设。'],['research','运行并读取结果','点击“运行示例”。观察累计收益、最大回撤、账户资产与买入持有基准。'],['research','核对一笔成交','切换“成交”，点击一笔成交的日期定位行情，再到“账户账本”核对现金与持仓。'],['compare','比较不同策略','查看相同数据和区间下的三条曲线。不要只看收益；也比较回撤与成交频率。'],['research','导出研究报告','点击“导出完整报告 JSON”，或切换“导出与口径”下载 CSV。完整桌面程序支持保存和重新导入实验。']];
function tourUpdate(){const i=state.tour;if(i<0){$('tour').hidden=true;return}const [page,title,copy]=tourSteps[i];if((i===3||i===5)&&!state.result)state.result=result();if(i===3)state.tab='trades';else if(i===5)state.tab='export';go(page);$('tour').hidden=false;$('tour-number').textContent=`操作导览 ${i+1} / 6`;$('tour-title').textContent=title;$('tour-copy').textContent=copy;$('tour-prev').disabled=i===0;$('tour-next').textContent=i===5?'完成导览':'下一步'}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('start-tour').onclick=()=>{state.tour=0;tourUpdate()};$('tour-prev').onclick=()=>{state.tour--;tourUpdate()};$('tour-next').onclick=()=>{state.tour=state.tour===5?-1:state.tour+1;tourUpdate();if(state.tour<0)log('导览完成 · 可自由切换数据与策略继续研究')};$('tour-close').onclick=()=>{state.tour=-1;tourUpdate()};$('native').onclick=()=>$('native-dialog').showModal();$('close-native').onclick=()=>$('native-dialog').close();let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,120)});render();
</script></body></html>
